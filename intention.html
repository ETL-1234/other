<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark">

<title>Intention Box</title>

<link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #F8F3EF;
    overflow: hidden; /* removes all scrollbars */
    font-family: 'Inter', sans-serif;
  }

 
  .wrapper {
    width: 100%;
    max-width: 600px;
    margin-top: 0;
    margin: 0 auto;
    padding: 20px 20px 0;
    box-sizing: border-box;
    position: relative;
  }

  @media (min-width: 768px) {
    .wrapper {
      padding: 0 40px;
    }
  }

  .card {
    background: #F8F3EF;
    border-radius: 16px;
    min-height: 160px;
    margin-top: 0px;
    padding: 20px 16px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap:6px;
  }

  textarea {
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    font-size: 18px;
    font-family: 'Bad Script', cursive;
    text-align: center;
    overflow: hidden;
    max-height: 120px;
    line-height: 1.3em;       
    padding: 0;  
    margin: 0;
  }

  textarea::placeholder {
    color: #000;
    opacity: 0.6;
  }

  /* animation */
 .step {
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.35s ease;
  pointer-events: none;
  height: 0;
  overflow: hidden;
}

.step.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
  height: auto;
}


  /* reset upper right */
 .reset {
  position: fixed;  
  top: 6px;
  right: 20px;
  cursor: pointer;
  z-index: 10;  
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: background 0.2s ease, transform 0.15s ease;
}

.reset svg {
  fill: #5c6b5c;
}

.reset:hover {
  background: rgba(0,0,0,0.05);
  transform: rotate(-20deg);
}

  @media (prefers-color-scheme: dark) {
  html, body {
    background: #000;
  }

  .card {
    background: #1a1a1a; /* soft dark instead of pure black */
  }

  textarea {
    color: #fff;
  }

  textarea::placeholder {
    color: #fff;
    opacity: 0.5;
  }

  .reset svg {
    fill: #ccc;
  }

  .reset:hover {
    background: rgba(255,255,255,0.08);
  }
}

</style>
</head>

<body>

<div class="wrapper">

  <div class="card">

    <div id="step1" class="step visible">
      <textarea id="input1" rows="1" placeholder="set your intention"></textarea>
    </div>

    <div id="step2" class="step">
      <textarea id="input2" rows="1" placeholder="choose your next action"></textarea>
    </div>

    <div id="step3" class="step">
      <textarea id="input3" rows="1" placeholder="define your mindset"></textarea>
    </div>

  </div>

  <!-- reset under box -->
<div class="reset" onclick="resetAll()" title="Reset">
  <svg viewBox="0 0 24 24" width="18" height="18">
    <path d="M12 5a7 7 0 1 1-6.32 4H3l3.5-3.5L10 9H7.66A5 5 0 1 0 12 7V5z"/>
  </svg>
</div>

</div>

<script>

  /* ANALYTICS */

const SUPABASE_URL = "https://tppyzexttkuvcobbbmaz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_VZiTsc0JGVx6tVf2Zu-9uQ_-FwjGpQW";

const SUPABASE_HEADERS = {
  apikey: SUPABASE_ANON_KEY,
  Authorization: `Bearer ${SUPABASE_ANON_KEY}`
};

const APP_NAME = "ETL";
const CONTENT_NAME = "I am framework";

async function track(eventType, metadata = {}) {

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/analytics_framework`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          Prefer: "return=minimal"
        },

        body: JSON.stringify({

          app_name: APP_NAME,

          title_name: CONTENT_NAME,

          event_type: eventType,

          meta_data: metadata

        })
      }
    );

    if (!response.ok) {

      const errorText = await response.text();

      console.error(
        "Analytics HTTP Error:",
        response.status,
        errorText
      );

    }

  } catch (err) {

    console.error(
      "Analytics network error:",
      err
    );

  }
}

const input1 = document.getElementById("input1");
const input2 = document.getElementById("input2");
const input3 = document.getElementById("input3");

  /* ANALYTICS STATE */

const INTENTION_CREATED_KEY = "intention_created_at";

let analyticsLastValues = {
  intention: "",
  next_action: "",
  mindset: ""
};

let intentionCreatedAt =
  localStorage.getItem(INTENTION_CREATED_KEY) || null;

const step2 = document.getElementById("step2");
const step3 = document.getElementById("step3");

// --- AUTO RESIZE ---
function autoResize(el) {
  el.style.height = "0px";    
  el.style.height = el.scrollHeight + "px";
}

// --- SAFE SAVE (fix for Draftbit timing issues) ---

  function saveData() {

  try {

    localStorage.setItem(
      "intention1",
      input1.value || ""
    );

    localStorage.setItem(
      "intention2",
      input2.value || ""
    );

    localStorage.setItem(
      "intention3",
      input3.value || ""
    );

  } catch(e) {}

}

// --- LOAD ---
function loadData() {

  input1.value =
    localStorage.getItem("intention1") || "";

  input2.value =
    localStorage.getItem("intention2") || "";

  input3.value =
    localStorage.getItem("intention3") || "";

  intentionCreatedAt =
    localStorage.getItem(INTENTION_CREATED_KEY) || null;

  analyticsLastValues = {

    intention: input1.value.trim(),

    next_action: input2.value.trim(),

    mindset: input3.value.trim()

  };

  autoResize(input1);
  autoResize(input2);
  autoResize(input3);

  updateUI();
}


// --- EVENTS ---
[input1, input2, input3].forEach(input => {

  input.addEventListener("input", (e) => {

    autoResize(e.target);

    saveData();

    updateUI();

  });


  input.addEventListener("blur", (e) => {

    handleAnalyticsBlur(e.target);

  });

});

    /* ANALYTICS */

function handleAnalyticsBlur(input) {

  const value = input.value.trim();

  if (!value) {
    return;
  }


  /* STEP 1 — INTENTION CREATED */

  if (
    input === input1 &&
    !intentionCreatedAt
  ) {

    intentionCreatedAt =
      new Date().toISOString();

    localStorage.setItem(
      INTENTION_CREATED_KEY,
      intentionCreatedAt
    );


    track("entry_created", {

      intention: value,

      created_at: intentionCreatedAt

    });


    analyticsLastValues.intention = value;

    return;
  }


  /* INTENTION UPDATED */

  if (
    input === input1 &&
    value !== analyticsLastValues.intention
  ) {

    track("intention_updated", {

      previous_intention:
        analyticsLastValues.intention,

      intention: value,

      updated_at:
        new Date().toISOString()

    });


    analyticsLastValues.intention = value;

    return;
  }


  /* STEP 2 COMPLETED */

  if (
    input === input2 &&
    value !== analyticsLastValues.next_action
  ) {

    track("step_completed", {

      step: 2,

      field: "next_action",

      value: value,

      intention:
        input1.value.trim(),

      created_at:
        intentionCreatedAt

    });


    analyticsLastValues.next_action = value;

    return;
  }


  /* STEP 3 COMPLETED */

  if (
    input === input3 &&
    value !== analyticsLastValues.mindset
  ) {

    track("step_completed", {

      step: 3,

      field: "mindset",

      value: value,

      intention:
        input1.value.trim(),

      next_action:
        input2.value.trim(),

      created_at:
        intentionCreatedAt

    });


    analyticsLastValues.mindset = value;

  }

}

  function updateUI() {
  const has1 = input1.value.trim() !== "";
  const has2 = input2.value.trim() !== "";

  step2.classList.toggle("visible", has1);
  step3.classList.toggle("visible", has2);
}
  
// --- RESET ---
function resetAll() {

  const intention =
    input1.value.trim();

  const nextAction =
    input2.value.trim();

  const mindset =
    input3.value.trim();


  /* ANALYTICS */

  if (intention && intentionCreatedAt) {

    const clearedAt =
      new Date().toISOString();


    const createdTime =
      new Date(intentionCreatedAt).getTime();

    const clearedTime =
      new Date(clearedAt).getTime();


    const daysActive =
      Math.floor(
        (clearedTime - createdTime) /
        (1000 * 60 * 60 * 24)
      );


    track("entry_cleared", {

      intention: intention,

      next_action: nextAction,

      mindset: mindset,

      created_at: intentionCreatedAt,

      cleared_at: clearedAt,

      days_active: daysActive

    });

  }


  /* CLEAR ONLY THIS COMPONENT'S STORAGE */

  input1.value = "";
  input2.value = "";
  input3.value = "";

  localStorage.removeItem("intention1");
  localStorage.removeItem("intention2");
  localStorage.removeItem("intention3");
  localStorage.removeItem(INTENTION_CREATED_KEY);


  intentionCreatedAt = null;


  analyticsLastValues = {

    intention: "",
    next_action: "",
    mindset: ""

  };


  autoResize(input1);
  autoResize(input2);
  autoResize(input3);

  updateUI();

  input1.focus();

}

// --- INIT ---
window.onload = () => {
  loadData();

  setTimeout(() => {
    input1.focus();
  }, 300);
};

</script>

</body>
</html>
